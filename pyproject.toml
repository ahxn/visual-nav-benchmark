[project]
name = "visual-nav-benchmark"
version = "0.1.0"
description = "Reproducible classical and learned visual-navigation benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python-headless>=4.9"]
ai2thor = ["ai2thor>=5.0"]
deep = ["transformers>=4.45", "accelerate>=1.0", "torch>=2.4"]
dev = ["pytest>=8.0"]

[project.scripts]
visual-nav = "visual_nav.cli:main"
visual-nav-thor = "visual_nav.thor_cli:main"
visual-nav-report = "visual_nav.report:main"
visual-nav-diagnostics = "visual_nav.diagnostics:main"
visual-nav-vo = "visual_nav.vo_benchmark:main"
visual-nav-vo-report = "visual_nav.vo_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_nav"]

